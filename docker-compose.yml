# docker-compose.yml

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # UI Jaeger
      - "4317:4317"     # OTLP gRPC

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hrpulse-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME}
    depends_on:
      - jaeger
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=http://backend:8000
    container_name: hrpulse-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

